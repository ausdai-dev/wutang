name: Keep Backend Warm

on:
  schedule:
    # 每 10 分钟探测一次，避免 Render 免费实例 15 分钟无请求后冷启动（用户首访等待 30-60s）
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "https://wutang-backend.onrender.com/api/health" || echo "000")
          echo "health status: $code"
          if [ "$code" != "200" ]; then
            echo "warm-up ping failed (cold start or transient); next scheduled run will retry"
          fi
