# Netlify 部署配置文件 - 悟堂·东方解忧处
[build]
  command = "python scripts/build_frontend.py"
  publish = "frontend"

[build.environment]
  PYTHON_VERSION = "3.12"

# 方案 1：反向代理 /api/* 请求至 Render 后台 (解决跨域与直连问题)
# 部署至 Render 后，将下方 URL 替换为您在 Render 上的真实后端地址即可 (如 https://wutang-service.onrender.com/api/:splat)
[[redirects]]
  from = "/api/*"
  to = "https://wutang-backend.onrender.com/api/:splat"
  status = 200
  force = true

# 单页应用 (SPA) 路由重定向：所有路径统一回退到 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 安全响应头与缓存策略
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
